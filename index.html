<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EXPO - GASTRO 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #E7FFDB; color: #1a2e1a; font-family: 'Montserrat', sans-serif; height: 100vh; overflow: hidden; display: flex; position: relative; }
        #particles-js { position: absolute; width: 100%; height: 100%; z-index: 1; }
        .visual-side { width: 50%; height: 100%; position: relative; overflow: hidden; z-index: 2; }
        .visual-side img { width: 100%; height: 100%; object-fit: cover; position: absolute; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .visual-side img.active { opacity: 1; }
        .visual-side::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.8), transparent, #E7FFDB); z-index: 3; }
        .interface-side { width: 50%; padding: 40px 60px; display: flex; flex-direction: column; justify-content: center; z-index: 20; }
        .view { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: center; }
        .view.active { display: flex; animation: slideFade 0.5s ease forwards; }
        @keyframes slideFade { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        h1 { font-family: 'Syncopate', sans-serif; font-size: 2.8rem; line-height: 1; margin-bottom: 15px; }
        h1 span { color: #2bb673; display: block; }
        .nav-groups { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; }
        .group-item { padding: 15px 25px; background: white; border: none; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .group-item:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(43, 182, 115, 0.2); }
        .btn-posters { background: #2bb673 !important; color: white !important; margin-top: 10px; }
        .btn-back { background: rgba(43, 182, 115, 0.1); border: 1px solid #2bb673; color: #2bb673; padding: 6px 15px; border-radius: 50px; cursor: pointer; margin-bottom: 15px; font-family: 'Syncopate'; font-size: 0.55rem; font-weight: 700; width: fit-content; }
        .card-link { text-decoration: none; color: inherit; display: block; height: 100%; }
        .team-card { background: white; padding: 20px 15px; border-radius: 10px; border-left: 5px solid #2bb673; box-shadow: 0 3px 8px rgba(0,0,0,0.05); transition: 0.3s; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; }
        .card-link:hover .team-card { transform: translateY(-3px); background: #f9fff6; }
        .team-card.empty { opacity: 0.4; border-left-color: #ccc; }
        .team-card h4 { font-weight: 800; font-size: 0.8rem; color: #2bb673; text-transform: uppercase; letter-spacing: 1px; }
        .file-list { flex-grow: 1; overflow-y: auto; padding-right: 15px; margin-top: 10px; }
        .file-group-label { background: rgba(43, 182, 115, 0.1); color: #2bb673; padding: 6px 12px; border-radius: 5px; font-weight: 800; font-size: 0.7rem; margin: 15px 0 8px 0; text-transform: uppercase; }
        .grid-posters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 5px; }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; height: 100vh; }
            .visual-side { width: 100%; height: 35vh; flex-shrink: 0; }
            .interface-side { width: 100%; padding: 30px 20px; height: auto; }
            h1 { font-size: 2.2rem; text-align: center; }
            .grid-posters { grid-template-columns: 1fr; }
            #team-container { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="visual-side" id="gallery">
        <img src="imagen/comida.jpg" class="active">
        <img src="imagen/comida2.jpg">
    </div>

    <div class="interface-side">
<div id="home" class="view active">
            <h1>EXPO<span>GASTRO</span></h1>
            
            <div style="background: rgba(255,255,255,0.6); padding: 15px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid #2bb673;">
                <h3 style="font-family: 'Syncopate'; font-size: 0.8rem; color: #2bb673; margin-bottom: 5px;">PROPÓSITO</h3>
                <p style="font-size: 0.85rem; line-height: 1.4; font-weight: 500;">
                    Exhibir los proyectos integradores de los grupos de Gastronomía, destacando la investigación, 
                    creatividad y el impacto social de cada equipo en el ciclo 2026.
                </p>
            </div>

            <div class="nav-groups">
                <button class="group-item" onclick="showGroup('GA5-1')"><h3>GA5-1</h3> <span>→</span></button>
                <button class="group-item" onclick="showGroup('GA5-2')"><h3>GA5-2</h3> <span>→</span></button>
                <button class="group-item" onclick="showGroup('GA5-3')"><h3>GA5-3</h3> <span>→</span></button>
                <button class="group-item" onclick="showGroup('GA5-4')"><h3>GA5-4</h3> <span>→</span></button>
                <button class="group-item btn-posters" onclick="showView('posters')"><h3>CARTELES</h3> <span>★</span></button>
            </div>
        </div>
        <div id="details" class="view">
            <button class="btn-back" onclick="showView('home')">← VOLVER AL MENÚ</button>
            <h2 id="group-title" style="font-family: 'Syncopate'; font-size: 2.2rem; color: #2bb673; margin-bottom: 20px;"></h2>
            <div id="team-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
        </div>

        <div id="posters" class="view">
            <button class="btn-back" onclick="showView('home')">← VOLVER AL MENÚ</button>
            <h2 style="font-family: 'Syncopate'; font-size: 1.5rem; margin-bottom: 5px;">GALERÍA DE <span>CARTELES</span></h2>
            <div class="file-list" id="global-file-list"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {"particles":{"number":{"value":30},"color":{"value":"#2bb673"},"shape":{"type":"circle"},"opacity":{"value":0.2},"size":{"value":3},"move":{"enable":true,"speed":1}}});

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if(viewId === 'posters') { loadAllPosters(); }
        }

function loadAllPosters() {
            const list = document.getElementById('global-file-list');
            list.innerHTML = ""; // Limpieza total para que no queden "fantasmas"
            
            const p = "archivos_carteles/";
            const pc = "archivos_carteles/carteles cientificos/";
            
            list.innerHTML = `
                <div class="file-group-label">GRUPO GA 5-1</div>
                <div class="grid-posters">
                    <a href="${p}ga1_1.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 1</h4></div></a>
                    <a href="${p}ga1_4.png" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 4</h4></div></a>
                </div>

                <div class="file-group-label">GRUPO GA 5-2</div>
                <div class="grid-posters">
                    <a href="${p}ga2_1.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 1</h4></div></a>
                    <a href="${p}ga2_2.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 2</h4></div></a>
                    <a href="${p}ga2_3.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 3</h4></div></a>
                    <a href="${p}ga2_4.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 4</h4></div></a>
                </div>

                <div class="file-group-label">GRUPO GA 5-3</div>
                <div class="grid-posters">
                    <a href="${p}ga53_equipo1.jpeg" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 1</h4></div></a>
                    <a href="${p}ga53_equipo2.jpeg" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 2</h4></div></a>
                    <a href="${p}ga53_equipo3.png" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 3</h4></div></a>
                </div>

                <div class="file-group-label">GRUPO GA 5-4</div>
                <div class="grid-posters">
                    <a href="${p}ga54_equipo2.png" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 2</h4></div></a>
                    <a href="${p}ga54_equipo3.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 3</h4></div></a>
                    <a href="${p}ga54_equipo4.png" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 4</h4></div></a>
                </div>

                <div class="file-group-label" style="background:#1a2e1a; color:white;">CARTELES CIENTÍFICOS</div>
                <div class="grid-posters">
                    <a href="${pc}comedor.jpg" target="_blank" class="card-link"><div class="team-card" style="border-left-color:#ffc107"><h4>PAPEL DEL COMEDOR</h4></div></a>
                    <a href="${pc}proteccion_animales.pdf" target="_blank" class="card-link"><div class="team-card" style="border-left-color:#ffc107"><h4>PROTECCIÓN ANIMAL</h4></div></a>
                </div>
            `;
        }
        function showGroup(name) {
            showView('details');
            document.getElementById('group-title').innerText = name;
            const container = document.getElementById('team-container');
            const pg = "archivos_grupos/";
            let content = "";

            if(name === 'GA5-1') {
                content += `<a href="${pg}ga1_equipo1.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 1</h4></div></a>`;
                content += `<a href="${pg}ga1_equipo3.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 3</h4></div></a>`;
                content += `<a href="${pg}ga1_equipo4.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 4</h4></div></a>`;
            } else if(name === 'GA5-2') {
                content += `<a href="${pg}ga2_equipo1.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 1</h4></div></a>`;
                content += `<a href="${pg}ga2_equipo2.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 2</h4></div></a>`;
                content += `<a href="${pg}ga2_equipo3.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 3</h4></div></a>`;
                content += `<a href="${pg}ga2_equipo4.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 4</h4></div></a>`;
            } else if(name === 'GA5-3') {
                content += `<a href="${pg}ga3_equipo1.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 1</h4></div></a>`;
                content += `<a href="${pg}ga3_equipo2.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 2</h4></div></a>`;
                content += `<a href="${pg}ga3_equipo3.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 3</h4></div></a>`;
            } else if(name === 'GA5-4') {
                content += `<a href="${pg}ga4_equipo2.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 2</h4></div></a>`;
                content += `<a href="${pg}ga4_equipo3.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 3</h4></div></a>`;
                content += `<a href="${pg}ga4_equipo4.pdf" target="_blank" class="card-link"><div class="team-card"><h4>EQUIPO 4</h4></div></a>`;
            }

            container.innerHTML = content || '<div class="team-card empty"><h4>PRÓXIMAMENTE</h4></div>';
        }

        const imgs = document.querySelectorAll('#gallery img');
        let idx = 0;
        setInterval(() => {
            if(imgs.length > 0) {
                imgs[idx].classList.remove('active');
                idx = (idx + 1) % imgs.length;
                imgs[idx].classList.add('active');
            }
        }, 5000);
    </script>
</body>
</html>
